<!DOCTYPE html>
<html>

<head>

<title>ProjectFlow Dashboard</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.container{
text-align:center;
}

.card{
background:#1e293b;
padding:25px;
border-radius:12px;
width:400px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
background:#3b82f6;
color:white;
border:none;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
font-size:16px;
width:100%;
}

button:hover{
background:#2563eb;
}

ul{
list-style:none;
padding:0;
margin-top:20px;
}

li{
background:#334155;
padding:10px;
margin:10px 0;
border-radius:8px;
}

</style>

</head>

<body>

<div class="container">

<h1>Task Dashboard</h1>

<div class="card">

<h2>Create Task</h2>

<input
type="text"
id="task"
placeholder="Task Name"
/>

<input
type="text"
id="member"
placeholder="Assign Member"
/>

<button onclick="createTask()">
Create Task
</button>

<div style="
position:fixed;
top:20px;
right:20px;
">

<button onclick="toggleTasks()">
Task List
</button>

</div>

<div id="taskBox" style="
display:none;
margin-top:20px;
background:#0f172a;
padding:15px;
border-radius:10px;
max-height:200px;
overflow-y:auto;
">

<ul id="taskList"></ul>

</div>

</div>

</div>

<script>

let tasks = [];

async function createTask(){

const taskName =
document.getElementById('task').value;

const member =
document.getElementById('member').value;

if(taskName === '' || member === ''){
alert('Fill all fields');
return;
}

const response = await fetch(
'https://task-dashboard-production-fb78.up.railway.app/tasks',
{
method:'POST',
headers:{
'Content-Type':'application/json'
},
body:JSON.stringify({
taskName,
member
})
});

const data = await response.json();

tasks.push(data.task);

displayTasks();

document.getElementById('task').value='';
document.getElementById('member').value='';

}

function displayTasks(){

const taskList =
document.getElementById('taskList');

taskList.innerHTML='';

tasks.forEach(task => {

taskList.innerHTML += `
<li>
<b>${task.taskName}</b>
<br>
Assigned to: ${task.member}
</li>
`;

});

}
function toggleTasks(){

const box =
document.getElementById('taskBox');

if(box.style.display === 'none'){
box.style.display = 'block';
}else{
box.style.display = 'none';
}

}

</script>

</body>

</html>
